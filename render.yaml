services:
  - type: cron
    name: grandmotherbot-paper-analysis
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    buildCommand: pip install -e .
    schedule: "0 3 * * 1"
    startCommand: >-
      if [ -f data/input/transactions.csv ] &&
         [ -f data/input/swaps.csv ] &&
         [ -f data/input/markouts.csv ];
      then
        python -m grandmotherbot_paper.cli analyze --input data/input --output output;
      else
        echo "GrandMother Render environment is ready. Normalized research inputs are not present yet; skipping analysis.";
      fi
