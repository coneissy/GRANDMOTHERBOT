[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grandmotherbot-paper-replication"
version = "0.1.0"
description = "Clean-room replication of arXiv:2507.13023v3 research methodology"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"