[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grandmotherbot"
version = "0.1.0"
description = "Research-faithful Ethereum CEX-DEX arbitrage engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
grandmother = "grandmother.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
