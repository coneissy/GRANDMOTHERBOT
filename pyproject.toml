[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grandmotherbot-paper-replication"
version = "0.3.0"
description = "Clean-room replication of arXiv:2507.13023v3 with GrandMother CEX market reconstruction"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
tardis = ["tardis-dev>=5.0,<6"]
parquet = ["pyarrow>=17"]

[project.scripts]
grandmother-paper = "grandmotherbot_paper.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
